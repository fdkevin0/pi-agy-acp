name: Feature request
description: Suggest an improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe your use case and any current workaround.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Suggested solution and alternatives
    validations:
      required: true
