name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    name: Manage release PR and tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: release-please-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm and GitHub Releases
    needs: release-please
    if: >-
      needs.release-please.outputs.release_created == 'true' ||
      (needs.release-please.result == 'skipped' && (
        startsWith(github.ref, 'refs/tags/v') ||
        github.event_name == 'workflow_dispatch'
      ))
    concurrency:
      group: release-publish-${{ needs.release-please.outputs.tag_name || github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name && format('refs/tags/{0}', needs.release-please.outputs.tag_name) || github.ref }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Validate release tag and check npm registry
        id: meta
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          REF_TYPE="${RELEASE_TAG:+tag}"
          REF_TYPE="${REF_TYPE:-$GITHUB_REF_TYPE}"
          REF_NAME="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          if [[ "$REF_TYPE" != tag || "$REF_NAME" != "v${VERSION}" ]]; then
            echo "::error::Run this workflow on the existing v${VERSION} tag."
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::This workflow publishes stable versions only (vX.Y.Z)."
            exit 1
          fi
          STATUS=$(curl --silent --show-error --max-time 30 \
            --output /dev/null --write-out '%{http_code}' \
            "https://registry.npmjs.org/${NAME}/${VERSION}")
          case "$STATUS" in
            200) PUBLISHED=true ;;
            404) PUBLISHED=false ;;
            *) echo "::error::npm registry returned HTTP ${STATUS}"; exit 1 ;;
          esac
          echo "published=${PUBLISHED}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.meta.outputs.published == 'false'
        run: npm install

      - name: Typecheck, test, and verify package
        if: steps.meta.outputs.published == 'false'
        run: |
          npm run check
          npm test
          npm pack --dry-run

      - name: Update npm for trusted publishing
        if: steps.meta.outputs.published == 'false'
        run: npm install --global npm@^11.5.1

      - name: Publish to npm
        if: steps.meta.outputs.published == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance

      - name: Ensure GitHub Release exists
        if: needs.release-please.outputs.release_created != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          TAG_NAME="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG_NAME} already exists."
          else
            gh release create "$TAG_NAME" --verify-tag \
              --title "$TAG_NAME" --generate-notes
          fi
